name: z2ron_story
description: z2roN_story - POP3/IMAP 메일을 메신저처럼 보여주는 앱 (Windows / Android)
publish_to: 'none'
version: 1.5.1+7

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  enough_mail: ^2.1.6
  path_provider: ^2.1.3
  intl: ^0.19.0
  file_picker: ^8.0.0
  open_filex: ^4.7.0
  cryptography: ^2.7.0
  flutter_widget_from_html_core: '>=0.15.0 <1.0.0'
  url_launcher: ^6.3.0
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#4B55E0"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
